<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music</title>
<style>
  :root { --bg: #f6f7f9; --surface: #fff; --text: #1a1d23; --muted: #626a77; --border: #dde1e7; --accent: #2f6fed; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121418; --surface: #1b1e24; --text: #e8eaee; --muted: #9aa2ae; --border: #2d323b; --accent: #5b8ff5; }
  }
  :root[data-theme="dark"] { --bg: #121418; --surface: #1b1e24; --text: #e8eaee; --muted: #9aa2ae; --border: #2d323b; --accent: #5b8ff5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 20px; }
  a.tool { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; color: inherit; text-decoration: none; margin-bottom: 10px; }
  a.tool:hover { border-color: var(--accent); }
  a.tool strong { display: block; color: var(--accent); font-size: 17px; }
  a.tool span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Music</h1>
  <a class="tool" href="spotify-stats/">
    <strong>Spotify Stats</strong>
    <span>Sign in with Spotify to see your top artists, tracks, genres and listening trends over time.</span>
  </a>
</main>
</body>
</html>
